name: Build Native Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native APK (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟩 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ⚙️ Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK with Gradle (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🚀 Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KlutchhAI-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
