name: 📱 Build React Native Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 🤖 Compile Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📱 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🛠️ Generate Native Android Project (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --clean

      - name: 🩹 Apply Android Gradle & AGP Compatibility Patches
        run: |
          node scripts/patch-android-build.cjs

      - name: 🔑 Configure Android Signing Keystore
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            mkdir -p android/app
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🏗️ Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Building Release / Universal APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon
          fi

      - name: 🔍 Locate Output APK Files
        id: find-apk
        run: |
          echo "Listing all generated APKs:"
          find android/app/build/outputs/apk -name "*.apk" -type f
          
          # Find the main APK file
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          echo "Found primary APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlutchhAI-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Build Summary
        run: |
          echo "### 🚀 React Native Android APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Klutchh AI" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** Android (React Native + Expo)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`KlutchhAI-Android-APK\` (Downloadable from GitHub Actions tab)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
