name: Build Android APK (GitHub Cloud Runner)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🛠️ Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package.json

      - name: 📱 Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;26.1.10909125'
          cmdline-tools-version: 11076708

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: 🚀 Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compile Standalone Release APK (Gradle)
        run: |
          cd android
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Klutchh-AI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
