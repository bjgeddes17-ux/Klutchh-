name: Build Native Mobile Apps (Android & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-web:
    name: 📦 1. Build Web Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Compile Production Web Build
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  build-android:
    name: 🤖 2. Build Native Android Binaries (APK & AAB)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Download Dist
        run: |
          rm -f package-lock.json
          npm install

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK (Debug / Test)
        working-directory: android
        run: |
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Bundle (Release AAB for Google Play)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace || true

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: klutchh-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Android Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: klutchh-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  build-ios:
    name: 🍎 3. Build Native iOS Project
    needs: build-web
    runs-on: macos-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Upload iOS Xcode Project
        uses: actions/upload-artifact@v4
        with:
          name: klutchh-ios-project
          path: ios/
          retention-days: 14
