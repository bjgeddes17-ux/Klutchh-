name: 🚀 EAS Android APK Cloud Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview = direct installable APK, production = AAB)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      wait:
        description: 'Wait for Expo Cloud build to complete & output QR code/APK URL'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: 📱 Build Android APK via Expo EAS Cloud
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🧹 Clean Local Machine Artifacts & Lockfiles
        run: |
          echo "Cleaning conflicting lock files and machine directories..."
          rm -rf .expo .expo-shared
          rm -f bun.lock bun.lockb yarn.lock pnpm-lock.yaml
          rm -rf android ios

      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 📦 Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: 🚀 Dispatch Build to Expo EAS Cloud
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_DOCTOR: "1"
          CI: "1"
        run: |
          BUILD_PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          SHOULD_WAIT="${{ github.event.inputs.wait != 'false' }}"
          
          echo "========================================================"
          echo "🚀 Dispatching Android Build to Expo Cloud (EAS)"
          echo "Profile: $BUILD_PROFILE (preview = standalone APK)"
          echo "========================================================"
          
          WAIT_FLAG=""
          if [ "$SHOULD_WAIT" = "false" ]; then
            WAIT_FLAG="--no-wait"
          fi
          
          eas build --platform android --profile "$BUILD_PROFILE" --non-interactive $WAIT_FLAG


